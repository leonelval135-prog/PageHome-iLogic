<style>
:root{--bg:#f2f2f4;--tx:#141416;--mut:#6b6b73;--gl:rgba(255,255,255,.62);--gb:rgba(255,255,255,.8);--ln:rgba(0,0,0,.09);--sh:rgba(20,20,40,.14);--ac:#141416;--ac-t:#fff;--ok:#1f7a3a;--no:#b3261e;--wn:#8a5a00;--f:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Helvetica Neue',Arial,sans-serif}
html[data-theme=dark]{--bg:#09090b;--tx:#f5f5f7;--mut:#9a9aa3;--gl:rgba(32,32,38,.55);--gb:rgba(255,255,255,.14);--ln:rgba(255,255,255,.1);--sh:rgba(0,0,0,.6);--ac:#f5f5f7;--ac-t:#0b0b0d;--ok:#5fd07f;--no:#ff8a80;--wn:#f0c35a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--f);min-height:100vh;-webkit-font-smoothing:antialiased}
.aur{position:fixed;inset:0;z-index:-1;overflow:hidden}.aur i{position:absolute;width:45vmax;height:45vmax;border-radius:50%;filter:blur(90px);opacity:.4;animation:dr 26s ease-in-out infinite alternate}.aur i:nth-child(1){background:#8a8a94;left:-12vmax;top:-12vmax}.aur i:nth-child(2){background:#cfcfd6;right:-14vmax;bottom:-10vmax;animation-delay:-9s;opacity:.3}
html[data-theme=dark] .aur i:nth-child(1){background:#4a4a54}html[data-theme=dark] .aur i:nth-child(2){background:#2c2c33}@keyframes dr{to{transform:translate(8vmax,6vmax) scale(1.15)}}
[hidden]{display:none!important}.wrap{max-width:1120px;margin:auto;padding:0 18px}
.g{background:var(--gl);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--gb),0 14px 34px -18px var(--sh);border-radius:22px}
header{position:sticky;top:10px;z-index:10;margin:10px auto 22px;width:min(1120px,calc(100% - 20px));padding:10px 16px;display:flex;align-items:center;gap:12px;border-radius:9999px}
header img{height:28px}.lg{filter:brightness(.15)}html[data-theme=dark] .lg{filter:none}header b{font-size:17px}header small{color:var(--mut);margin-right:auto}
button,input,select{font:inherit;color:inherit}.b{border:1px solid var(--ln);background:transparent;border-radius:9999px;padding:7px 16px;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}.b:hover{transform:scale(1.04);background:rgba(127,127,140,.16)}.b:active{transform:scale(.96)}.b:disabled{opacity:.5;pointer-events:none}
.p{background:var(--ac);color:var(--ac-t);border-color:transparent}.p:hover{background:var(--ac);filter:brightness(1.1)}.d{color:var(--no)}.sm{padding:5px 12px;font-size:13px}
input{background:rgba(127,127,140,.12);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;width:100%;outline:none}input:focus{border-color:var(--tx)}
nav.tabs{display:flex;gap:6px;padding:5px;border-radius:9999px;width:max-content;max-width:100%;overflow:auto;margin-bottom:22px}nav.tabs button{border:0;background:none;padding:8px 18px;border-radius:9999px;cursor:pointer;white-space:nowrap;color:var(--mut);transition:background .25s,color .25s}nav.tabs button[aria-pressed=true]{background:var(--ac);color:var(--ac-t)}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:22px}.kp>div{padding:20px;animation:up .5s both}.kp small{color:var(--mut)}.kp strong{display:block;font-size:34px;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.bar input{max-width:280px}
.list{display:grid;gap:12px}.row{padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;animation:up .45s both}.row .m{color:var(--mut);font-size:13px}.row .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dt{min-width:76px;text-align:center;line-height:1.15}.dt b{display:block;font-size:20px;letter-spacing:-.02em}.dt span{font-size:12px;color:var(--mut)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:rgba(127,127,140,.25);display:grid;place-items:center;font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:9999px;border:1px solid currentColor;margin-left:6px}.t-p{color:var(--wn)}.t-a{color:var(--ok)}.t-r,.t-x{color:var(--mut)}.t-ad{color:var(--tx)}
.empty{padding:40px;text-align:center;color:var(--mut)}.note{padding:16px 18px;margin-bottom:16px;font-size:14px}
#login{max-width:380px;margin:12vh auto;padding:30px;display:grid;gap:14px}#login h1{margin:0;font-size:24px;letter-spacing:-.02em}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;padding:12px 20px;border-radius:9999px;transition:.35s;z-index:50;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){.row{grid-template-columns:auto 1fr}.row .acts{grid-column:1/-1;justify-content:flex-start}header small{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9999px;background:var(--no);color:#fff;font-size:11px;font-weight:700;line-height:1}
#bell{position:relative}#bell .bd{position:absolute;top:-6px;right:-6px;margin:0}
.live{font-size:12px;color:var(--mut);white-space:nowrap}.live.on{color:var(--ok)}
#np{position:fixed;top:72px;right:max(10px,calc((100vw - 1120px)/2));width:min(400px,calc(100% - 20px));max-height:72vh;display:flex;flex-direction:column;z-index:40;padding:0;overflow:hidden;animation:up .3s both}
.nh,.nf{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px}.nh{border-bottom:1px solid var(--ln)}.nf{border-top:1px solid var(--ln);flex-wrap:wrap}
.nl{overflow:auto;flex:1}
.nt{display:flex;align-items:stretch;border-bottom:1px solid var(--ln)}.nt.un{background:rgba(127,127,140,.1)}
.nb{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:none;padding:12px 6px 12px 14px;cursor:pointer}.nb:hover{background:rgba(127,127,140,.12)}

    h('div',{class:'acts'},h('button',{class:'b sm d',onclick:()=>cf('¿Eliminar esta reseña?',()=>act(()=>sb.from('reviews').delete().eq('id',r.id),'Reseña eliminada'),'Eliminar')},'Eliminar')))):[h('div',{class:'empty g'},'Aún no hay reseñas.')])},

    save=(extra,msg)=>act(()=>sb.from('shop_status').update(Object.assign({},extra,{note:n.value.trim()||null,updated_at:new Date().toISOString()})).eq('id',1),msg).then(()=>{S.draft=null;render()});
  return h('div',{class:'g',style:'padding:24px;max-width:520px;display:grid;gap:14px'},h('h3',{style:'margin:0'},'Estado de hoy: '+(S.shop?(o?'Abierto':'Cerrado'):'no disponible')),n,
    h('div',{class:'bar',style:'margin:0'},h('button',{class:'b p',onclick:()=>save({is_open:!o},'Estado actualizado')},o?'Marcar como cerrado':'Marcar como abierto'),h('button',{class:'b',onclick:()=>save({},'Nota guardada')},'Guardar nota')))}};

/* ───────── Render ───────── */
const TABS=[['res','Resumen'],['cit','Citas'],['usr','Usuarios'],['rev','Reseñas'],['loc','Local']];
function tabs(){const c={cit:S.cit.filter(r=>st(r)==='pendiente').length,usr:N.list.filter(n=>!n.read&&n.tab==='usr').length};
  $('#tabs').replaceChildren(...TABS.map(([k,l])=>h('button',{'data-t':k,'aria-pressed':String(S.tab===k)},l,c[k]?h('span',{class:'bd'},c[k]):null)))}
function chrome(){
  const u=N.list.filter(n=>!n.read).length,bc=$('#bc'),lv=$('#live');
  bc.hidden=!u;bc.textContent=u>99?'99+':u;document.title=(u?'('+u+') ':'')+TITLE;
  lv.textContent=S.me?(RT.ok?'● En vivo':'○ Sondeo'):'';lv.className='live'+(RT.ok?' on':'');
  lv.title=RT.ok?'Avisos en tiempo real':'Revisando cada 15 s (Realtime no disponible)';
  tabs();panel()}
let lastTab;
function render(){
  const a=document.activeElement,key=a&&a.dataset&&a.dataset.k,pos=key?a.selectionStart:0,v=$('#v');
  NEW=new Set(N.list.filter(n=>!n.read).map(n=>n.id));
  v.className=lastTab===S.tab?'still':'';lastTab=S.tab;
  v.replaceChildren(views[S.tab]());
  if(key){const n=v.querySelector('[data-k="'+key+'"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
  chrome()}
function go(tab,fromN){S.tab=tab;S.q='';if(fromN&&tab==='cit')S.f='todas';N.open=false;render();markRead(n=>n.tab===tab)}

/* ───────── Eventos ───────── */
$('#tabs').onclick=e=>{const b=e.target.closest('button[data-t]');if(b)go(b.dataset.t)};
$('#rf').onclick=async()=>{await load(true);toast('Actualizado')};
$('#out').onclick=async()=>{if(!sb)return;
  try{if(PUSH.reg&&S.me){const sub=await PUSH.reg.pushManager.getSubscription();if(sub){await sb.rpc('quitar_dispositivo',{p_token:sub.endpoint});await sub.unsubscribe()}}}catch(e){}
  PUSH.on=false;sb.auth.signOut()};
$('#bell').onclick=()=>{N.open=!N.open;panel()};
document.addEventListener('click',e=>{if(!N.open)return;const p=e.composedPath();if(!p.includes($('#np'))&&!p.includes($('#bell'))){N.open=false;panel()}});
document.addEventListener('pointerdown',()=>{const c=ctx();c&&c.state==='suspended'&&c.resume()},{once:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.me){load();if(!RT.ok)rtStart()}});
window.addEventListener('online',()=>{if(S.me){load();rtStart()}});
const th=$('#th'),setT=t=>{document.documentElement.dataset.theme=t;LS.set('amb_theme',t);th.textContent=t==='dark'?'☀':'☾'};
th.onclick=()=>setT(document.documentElement.dataset.theme==='dark'?'light':'dark');setT(document.documentElement.dataset.theme);
$('#login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=1;lm('');
  const{error}=await sb.auth.signInWithPassword({email:e.target.e.value.trim(),password:e.target.p.value});b.disabled=0;
  if(error)lm(/confirm/i.test(error.message)?'Confirma tu correo antes de entrar.':'Correo o contraseña incorrectos.')};
setInterval(()=>document.querySelectorAll('[data-exp]').forEach(s=>{const ms=new Date(s.dataset.exp).getTime()+EXP-Date.now();
  s.textContent=ms<=0?'0:00':Math.floor(ms/6e4)+':'+String(Math.floor(ms/1e3)%60).padStart(2,'0');
  if(ms<=0&&!s.dataset.z){s.dataset.z='1';setTimeout(()=>load(true),1500)}}),1000);

/* ───────── Ganchos para la app Android (WebView) ───────── */
window.ambBack=()=>{if(M.cancel){M.cancel();return true}if(N.open){N.open=false;panel();return true}return false};
window.ambOpenTab=t=>{if(!TABS.some(x=>x[0]===t))return;if(S.me)go(t,true);else PEND=t};
/* Web Push: avisos con la pestaña o el navegador cerrados (service worker + Supabase) */
const b64=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function pushKey(){
  let r=await sb.rpc('vapid_publica');
  if(r.error)throw new Error('ejecuta de nuevo notificaciones.sql ('+r.error.message+')');
  if(r.data)return r.data;
  /* Primera vez: se genera el par de llaves VAPID aquí mismo y se guarda en tu base de datos (solo admins). */
  const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']),j=await crypto.subtle.exportKey('jwk',kp.privateKey),
    pub=new Uint8Array(65);pub[0]=4;pub.set(b64(j.x),1);pub.set(b64(j.y),33);
  const enc=a=>btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  r=await sb.rpc('guardar_vapid',{p_public:enc(pub),p_private:j.d});
  if(r.error||!r.data)throw new Error('no se pudo guardar la llave'+(r.error?' ('+r.error.message+')':''));
  return r.data}
async function pushSave(sub){
  const{error}=await sb.rpc('registrar_dispositivo',{p_token:sub.endpoint,p_platform:'web',p_sub:sub.toJSON()});
  if(error)throw new Error(error.message)}
async function pushWorker(){
  if(!window.isSecureContext)throw new Error('requiere https');
  if(!PUSH.reg){PUSH.reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready}
  return PUSH.reg}
async function pushInit(){
  if(!PUSH.sup||!sb||!S.me)return;
  try{const reg=await pushWorker(),sub=await reg.pushManager.getSubscription();
    if(sub&&Notification.permission==='granted'){await pushSave(sub);PUSH.on=true}else PUSH.on=false;PUSH.err=''}
  catch(e){PUSH.on=false;PUSH.err=e.message}
  chrome()}
async function togPush(){
  if(!PUSH.sup)return toast('Este navegador no soporta notificaciones push.',1,4000);
  try{
    const reg=await pushWorker(),cur=await reg.pushManager.getSubscription();
    if(PUSH.on&&cur){await sb.rpc('quitar_dispositivo',{p_token:cur.endpoint});await cur.unsubscribe();PUSH.on=false;PUSH.err='';chrome();return toast('Push desactivado en este navegador')}
    const perm=Notification.permission==='default'?await Notification.requestPermission():Notification.permission;
    if(perm!=='granted')throw new Error('permiso denegado: actívalo en los permisos del sitio');
    const key=await pushKey();
    if(cur)await cur.unsubscribe();
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(key)});
    await pushSave(sub);PUSH.on=true;PUSH.err='';chrome();toast('Push activado: te avisará aunque cierres la pestaña',0,4500)}
  catch(e){PUSH.on=false;PUSH.err=e.message;chrome();toast('No se pudo activar el push: '+e.message,1,6000)}}
if(PUSH.sup)navigator.serviceWorker.addEventListener('message',e=>{const m=e.data||{};if(m.type==='open')window.ambOpenTab(m.tab)});
window.ambResume=()=>{if(S.me){load();if(!RT.ok)rtStart()}};

/* ───────── Sesión ───────── */
function reset(){S.me=null;S.cit=[];S.usr=[];S.rev=[];S.shop=null;S.sig='';S.draft=null;
  N.list=[];N.known={cit:new Set(),usr:new Set()};N.primed=false;N.open=false;PUSH.on=false;rtStop();clearTimeout(pt);chrome()}
async function boot(s){
  $('#app').hidden=true;$('#login').hidden=false;
  if(!s){reset();return}
  let p=null,err=null;try{const r=await sb.from('profiles').select('is_admin,name').eq('id',s.user.id).maybeSingle();p=r.data;err=r.error}catch(x){err=x}
  if(err||!p||p.is_admin!==true){await sb.auth.signOut();lm(err?'No se pudo verificar tu cuenta: '+err.message:'Esta cuenta no tiene permisos de administrador.');return}
  $('#login').hidden=true;lm('');S.me=s.user.id;$('#me').textContent=p.name||s.user.email;$('#app').hidden=false;
  await load(true);rtStart();poll();pushInit();if(PEND){const t=PEND;PEND=null;if(TABS.some(x=>x[0]===t))go(t,true)}}
if(!sb){lm('No se pudo cargar Supabase. Recarga la página.');$('#login').onsubmit=e=>e.preventDefault()}
else sb.auth.onAuthStateChange((_,s)=>setTimeout(()=>boot(s),0));
})();
