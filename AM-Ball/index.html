<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#050607">
<title>A.M. Ball · A.M. Barber</title>
<link rel="icon" href="assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head><body>
<section id="intro">
  <div class="ib"></div>
  <img class="lg" src="assets/logo-white.png" alt="A.M. Barber">
  <h1>A.M. BALL</h1>
  <p class="sl">Corte fino, trabajo firme.</p>
  <input id="nm" maxlength="14" placeholder="Tu nombre" autocomplete="off">
  <button id="go">Entrar</button>
</section>
<main id="app" hidden>
  <header>
    <button id="menu" class="mb" aria-label="Menú">&#9776;</button>
    <div id="pl" class="card"></div><div id="clock">10:00</div><div id="bt" class="card"></div>
    <button id="mu" class="cb" aria-label="Sonido"></button>
  </header>
  <aside id="left"><div id="pwr" title="Potencia"><div id="fill"></div></div></aside>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <aside id="right"><div id="tray"></div></aside>
  <div id="msg"></div>
</main>
<div id="rot"><div>&#128241;</div><p>Gira tu teléfono en horizontal para jugar</p></div>
<div id="modal" hidden></div>
<script src="js/game.js"></script>
</body></html>
