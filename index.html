<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Seguridad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: '#000000',
                        light: '#ffffff',
                        accent: '#ffffff',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Efecto de fondo animado */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            filter: blur(80px);
            opacity: 0.15;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            animation: float 20s infinite linear;
        }

        .shape:nth-child(1) { width: 30vw; height: 30vw; top: 10%; left: 10%; animation-duration: 25s; }
        .shape:nth-child(2) { width: 40vw; height: 40vw; top: 60%; left: 60%; animation-duration: 30s; animation-direction: reverse; }
        .shape:nth-child(3) { width: 25vw; height: 25vw; top: 50%; left: 20%; animation-duration: 22s; }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* Tarjeta de cristal */
        .glass-card {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 1);
        }

        /* Animación de fade in */
        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <main class="glass-card w-full max-w-md rounded-2xl p-8 flex flex-col items-center text-center fade-in">
        
        <!-- Icono de escudo -->
        <div class="w-16 h-16 mb-6 rounded-full bg-white/5 flex items-center justify-center border border-white/10">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
        </div>

        <h1 class="text-2xl font-semibold mb-2 tracking-tight">Verificación de Seguridad</h1>
        <p class="text-gray-400 text-sm mb-8">Por favor, completa el siguiente desafío para confirmar que eres humano antes de acceder al sitio.</p>

        <div id="captchaContainer" class="w-full bg-black/40 rounded-xl p-6 border border-white/5 mb-6">
            <p class="text-sm font-medium mb-4 text-gray-300">Selecciona el número mayor:</p>
            
            <div class="grid grid-cols-3 gap-3" id="captchaGrid">
                <!-- Los botones se generarán con JS -->
            </div>
            
            <p id="errorMessage" class="text-red-400 text-xs mt-4 h-4 opacity-0 transition-opacity">Selección incorrecta, intenta de nuevo.</p>
        </div>

        <div id="verificationStatus" class="hidden w-full flex flex-col items-center justify-center py-6">
            <div class="loader mb-4"></div>
            <p class="text-sm text-gray-300">Verificando y redirigiendo de forma segura...</p>
        </div>

        <div class="mt-8 text-xs text-gray-600 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            Conexión Segura
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('captchaGrid');
            const errorMsg = document.getElementById('errorMessage');
            const captchaContainer = document.getElementById('captchaContainer');
            const verificationStatus = document.getElementById('verificationStatus');
            
            let correctValue;

            // Función para generar números aleatorios
            function getRandomNumbers(count, max) {
                const nums = new Set();
                while(nums.size < count) {
                    nums.add(Math.floor(Math.random() * max) + 1);
                }
                return Array.from(nums);
            }

            // Inicializar el CAPTCHA
            function initCaptcha() {
                grid.innerHTML = '';
                errorMsg.style.opacity = '0';
                
                const numbers = getRandomNumbers(6, 99);
                correctValue = Math.max(...numbers);

                // Barajar visualmente
                numbers.sort(() => Math.random() - 0.5);

                numbers.forEach(num => {
                    const btn = document.createElement('button');
                    btn.className = 'w-full py-3 rounded-lg bg-white/5 hover:bg-white/15 border border-white/10 transition-all duration-200 text-lg font-medium text-white focus:outline-none focus:ring-2 focus:ring-white/30';
                    btn.textContent = num;
                    btn.onclick = () => handleSelection(num, btn);
                    grid.appendChild(btn);
                });
            }

            // Manejar la selección del usuario
            function handleSelection(selectedNum, btnElement) {
                if (selectedNum === correctValue) {
                    // Éxito
                    btnElement.classList.remove('bg-white/5', 'hover:bg-white/15');
                    btnElement.classList.add('bg-green-500/30', 'border-green-500/50', 'text-green-300');
                    
                    // Ocultar captcha y mostrar carga
                    setTimeout(() => {
                        captchaContainer.classList.add('hidden');
                        verificationStatus.classList.remove('hidden');
                        verificationStatus.classList.add('flex');
                        
                        // Simular redirección
                        setTimeout(() => {
                            // Aquí se realizaría la redirección real
                            // window.location.href = '/Home/index.html';
                            
                            // Para propósitos de demostración en este entorno, mostramos un mensaje
                            verificationStatus.innerHTML = `
                                <div class="w-12 h-12 mb-4 rounded-full bg-green-500/20 flex items-center justify-center text-green-400">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <p class="text-sm text-green-400 font-medium">Verificación exitosa</p>
                                <p class="text-xs text-gray-400 mt-2">Redirigiendo a /Home/index.html...</p>
                            `;
                            
                            // Si estuvieras en un servidor real, descomentarías la línea de window.location.href
                        }, 2000);
                    }, 500);

                } else {
                    // Fallo
                    btnElement.classList.add('bg-red-500/20', 'border-red-500/50', 'text-red-400', 'animate-pulse');
                    errorMsg.style.opacity = '1';
                    
                    // Resetear después de un breve momento
                    setTimeout(() => {
                        initCaptcha();
                    }, 1000);
                }
            }

            // Iniciar por primera vez
            initCaptcha();
        });
    </script>
</body>
</html>
