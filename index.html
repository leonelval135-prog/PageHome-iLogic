<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Onyx Technologies</title>

    <link rel="icon" type="image/png" href="https://i.ibb.co/3YTjDBXc/Secound-Logo.png">
    <link rel="shortcut icon" type="image/png" href="https://i.ibb.co/3YTjDBXc/Secound-Logo.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/3YTjDBXc/Secound-Logo.png">

    <meta property="og:title" content="Verificación de Seguridad">
    <meta property="og:image" content="https://i.ibb.co/3YTjDBXc/Secound-Logo.png">
    <meta property="og:image:type" content="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color:#000; color:#fff; overflow:hidden; position:relative; }

        .bg-shapes { position:absolute; inset:0; z-index:-1; overflow:hidden; filter:blur(80px); opacity:.15; }
        .shape { position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.1) 0%, rgba(255,255,255,0) 70%); animation:float 20s infinite linear; }
        .shape:nth-child(1){ width:30vw; height:30vw; top:10%; left:10%; animation-duration:25s; }
        .shape:nth-child(2){ width:40vw; height:40vw; top:60%; left:60%; animation-duration:30s; animation-direction:reverse; }
        .shape:nth-child(3){ width:25vw; height:25vw; top:50%; left:20%; animation-duration:22s; }
        @keyframes float {
            0%{transform:translate(0,0) rotate(0)} 33%{transform:translate(30px,-50px) rotate(120deg)}
            66%{transform:translate(-20px,20px) rotate(240deg)} 100%{transform:translate(0,0) rotate(360deg)}
        }

        .glass-card { background:rgba(0,0,0,.85); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.05); box-shadow:0 25px 50px -12px #000; }
        .fade-in { animation:fadeIn .8s cubic-bezier(.4,0,.2,1) forwards; opacity:0; transform:translateY(20px); }
        @keyframes fadeIn { to { opacity:1; transform:translateY(0); } }

        .loader { border:3px solid rgba(255,255,255,.1); border-top:3px solid #fff; border-radius:50%; width:24px; height:24px; animation:spin 1s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        .opt { width:100%; padding:.75rem .5rem; border-radius:.5rem; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); transition:all .2s; font-weight:500; color:#fff; }
        .opt:hover:not(:disabled) { background:rgba(255,255,255,.15); }
        .opt:focus-visible, .txt:focus-visible { outline:2px solid rgba(255,255,255,.6); outline-offset:2px; }
        .opt:disabled { cursor:default; }
        .opt.ok  { background:rgba(34,197,94,.3); border-color:rgba(34,197,94,.5); color:#86efac; }
        .opt.bad { background:rgba(239,68,68,.2); border-color:rgba(239,68,68,.5); color:#f87171; animation:shake .35s; }
        .opt.picked { background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.4); color:#9ca3af; }
        @keyframes shake { 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

        .txt { width:100%; padding:.75rem 1rem; border-radius:.5rem; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#fff; text-align:center; font-size:1.125rem; }
        .dot { width:.5rem; height:.5rem; border-radius:9999px; background:rgba(255,255,255,.15); transition:background .3s; }
        .dot.on { background:#fff; }
        .dot.now { background:rgba(255,255,255,.5); }

        @media (prefers-reduced-motion: reduce) {
            .shape, .fade-in, .opt.bad { animation:none; }
            .fade-in { opacity:1; transform:none; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-shapes"><div class="shape"></div><div class="shape"></div><div class="shape"></div></div>

    <main class="glass-card w-full max-w-md rounded-2xl p-8 flex flex-col items-center text-center fade-in">

        <div class="w-16 h-16 mb-6 rounded-full bg-white/5 flex items-center justify-center border border-white/10">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
        </div>

        <h1 id="pageTitle" class="text-2xl font-semibold mb-2 tracking-tight">Verificación de Seguridad</h1>
        <p id="pageDesc" class="text-gray-400 text-sm mb-8">Soluciones digitales integrales: desde desarrollo de software y aplicaciones móviles hasta protección y optimización de infraestructura.</p>

        <div id="captchaContainer" class="w-full bg-black/40 rounded-xl p-6 border border-white/5 mb-6">
            <div class="flex items-center justify-between mb-3">
                <div class="flex gap-2" id="dots" aria-label="Progreso"></div>
                <span id="timerLabel" class="text-xs text-gray-500 tabular-nums"></span>
            </div>
            <div class="w-full h-1 rounded bg-white/10 mb-5 overflow-hidden">
                <div id="timerBar" class="h-full bg-white/60" style="width:100%"></div>
            </div>

            <p id="prompt" class="text-sm font-medium mb-4 text-gray-300"></p>
            <div id="display" class="hidden text-3xl font-semibold mb-4 tracking-wide"></div>
            <div id="area"></div>

            <!-- Honeypot: los usuarios no lo ven, los bots suelen rellenarlo -->
            <input type="text" id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;height:0;width:0">

            <p id="errorMessage" role="alert" class="text-red-400 text-xs mt-4 min-h-[1rem] opacity-0 transition-opacity"></p>
        </div>

        <div id="lockout" class="hidden w-full bg-black/40 rounded-xl p-6 border border-red-500/20 mb-6">
            <p class="text-sm text-red-300 mb-1">Demasiados intentos fallidos</p>
            <p class="text-xs text-gray-400">Podrás intentarlo de nuevo en <span id="lockTime" class="tabular-nums text-gray-200">0</span> s</p>
        </div>

        <div id="verificationStatus" class="hidden w-full flex flex-col items-center justify-center py-6">
            <div class="loader mb-4"></div>
            <p id="verificationText" class="text-sm text-gray-300">Verificando y redirigiendo de forma segura...</p>
        </div>

        <div class="mt-8 text-xs text-gray-600 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            Conexión Segura
        </div>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // ---------- Configuración ----------
        const REDIRECT_URL   = './Home/index.html';
        const ROUNDS         = 3;        // retos a superar
        const MAX_FAILS      = 3;        // fallos antes del bloqueo
        const LOCK_SECONDS   = 30;       // duración del bloqueo
        const TIME_PER_ITEM  = 25;       // segundos por reto
        const VERIFIED_TTL   = 24 * 60 * 60 * 1000; // la verificación dura 24 h
        const KEY_OK   = 'device_verified_v2';
        const KEY_LOCK = 'captcha_lock_until';

        // ---------- Elementos ----------
        const $ = id => document.getElementById(id);
        const area = $('area'), promptEl = $('prompt'), displayEl = $('display'), errorMsg = $('errorMessage');
        const dotsEl = $('dots'), timerBar = $('timerBar'), timerLabel = $('timerLabel');
        const captchaContainer = $('captchaContainer'), verificationStatus = $('verificationStatus');
        const lockout = $('lockout'), lockTime = $('lockTime');

        // ---------- Utilidades ----------
        const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
        const int = (a, b) => a + rnd(b - a + 1);
        const pick = arr => arr[rnd(arr.length)];
        const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
        const uniqueInts = (count, min, max) => { const s = new Set(); while (s.size < count) s.add(int(min, max)); return [...s]; };
        const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();

        function wrongNumbers(answer, count, spread = 6) {
            const s = new Set();
            while (s.size < count) {
                const d = int(1, spread) * (rnd(2) ? 1 : -1);
                const v = answer + d;
                if (v !== answer && v >= 0) s.add(v);
            }
            return [...s];
        }
        const choice = (prompt, correct, wrong, opts = {}) => ({
            kind: 'choice', prompt, cols: opts.cols || 2, display: opts.display || null,
            options: shuffle([correct, ...wrong].map(String)), answer: String(correct)
        });

        // ---------- Banco de retos ----------
        const RIDDLES = [
            ['Tengo ciudades pero no casas, montañas pero no árboles y agua pero no peces. ¿Qué soy?', 'Un mapa', ['Un sueño', 'Un piano', 'Un reloj']],
            ['Cuanto más le quitas, más grande se hace. ¿Qué es?', 'Un agujero', ['Un globo', 'Un pastel', 'Un río']],
            ['Blanca por dentro, verde por fuera. Si quieres que te lo diga, espera.', 'La pera', ['La manzana', 'El limón', 'La uva']],
            ['Oro parece, plata no es. ¿Qué es?', 'El plátano', ['El limón', 'La moneda', 'El maíz']],
            ['Vuelo sin alas, lloro sin ojos. ¿Qué soy?', 'Una nube', ['Un avión', 'Un pájaro', 'Una estrella']],
            ['Tiene dientes pero no muerde, y se usa para el cabello.', 'Un peine', ['Un tiburón', 'Una sierra', 'Un cepillo de dientes']],
            ['Tiene teclas pero no abre puertas, y martillos pero no clava.', 'Un piano', ['Una cerradura', 'Una caja de herramientas', 'Un llavero']],
            ['Mientras más se seca, más se moja. ¿Qué es?', 'La toalla', ['La esponja', 'El sol', 'La lluvia']],
            ['Siempre está delante de ti, pero no puedes verlo.', 'El futuro', ['El horizonte', 'El aire', 'Tu sombra']],
            ['¿Qué pesa más: un kilo de plumas o un kilo de hierro?', 'Pesan lo mismo', ['Las plumas', 'El hierro', 'Depende del color']],
            ['Soy ligero como una pluma, pero ni la persona más fuerte me aguanta mucho rato.', 'El aliento', ['El humo', 'El viento', 'Un hilo']],
            ['Tiene ojos pero no ve, tiene agua pero no es mar.', 'La papa', ['El pez', 'La nube', 'El ciego']]
        ];
        const SECURITY = [
            ['¿Cuál de estas contraseñas es la más segura?', 'Qw8$vL2#nP9zR!', ['123456', 'password', 'miNombre2024']],
            ['Recibes un correo que te pide tu contraseña "urgente". ¿Qué haces?', 'Lo ignoro y lo reporto como phishing', ['Respondo con mi contraseña', 'Hago clic en el enlace para revisar', 'Lo reenvío a mis amigos']],
            ['¿Qué significa la "S" en HTTPS?', 'Secure (seguro)', ['Server', 'Simple', 'Speed']],
            ['El phishing consiste en…', 'Suplantar a alguien para robar datos', ['Acelerar una red Wi-Fi', 'Borrar virus automáticamente', 'Comprimir archivos']],
            ['¿Qué añade la verificación en dos pasos (2FA)?', 'Una segunda prueba de identidad', ['Más velocidad al iniciar sesión', 'Un antivirus gratis', 'Una contraseña más corta']],
            ['¿Qué candado/icono indica una conexión cifrada en el navegador?', 'Un candado cerrado', ['Una bandera', 'Una lupa', 'Una estrella']],
            ['¿Qué es un firewall?', 'Un filtro que controla el tráfico de red', ['Un tipo de virus', 'Un editor de fotos', 'Una red social']],
            ['¿Con qué frecuencia conviene reutilizar la misma contraseña en varios sitios?', 'Nunca', ['Siempre', 'Solo en redes sociales', 'Solo en correos']]
        ];
        const ODD = [
            [['Manzana', 'Pera', 'Uva'], 'Silla'], [['Perro', 'Gato', 'Conejo'], 'Mesa'],
            [['Rojo', 'Azul', 'Verde'], 'Lunes'], [['Python', 'Java', 'Rust'], 'Martes'],
            [['Teclado', 'Ratón', 'Monitor'], 'Tenedor'], [['París', 'Lima', 'Roma'], 'Amazonas'],
            [['Firefox', 'Chrome', 'Safari'], 'Excel'], [['Guitarra', 'Violín', 'Piano'], 'Martillo']
        ];
        const WORDS = ['sol', 'red', 'clave', 'nube', 'cifrar', 'redes', 'seguro', 'acceso', 'datos', 'nodo'];
        const COLORS = [['rojo', '#ef4444'], ['azul', '#3b82f6'], ['verde', '#22c55e'], ['amarillo', '#eab308'], ['morado', '#a855f7'], ['naranja', '#f97316']];
        const SHAPES = ['⭐', '🔷', '🌙', '🔺', '🟢'];

        const GENERATORS = {
            maximo() {
                const n = uniqueInts(6, 1, 99);
                return choice('Selecciona el número mayor:', Math.max(...n), n.filter(x => x !== Math.max(...n)), { cols: 3 });
            },
            minimo() {
                const n = uniqueInts(6, 1, 99);
                return choice('Selecciona el número menor:', Math.min(...n), n.filter(x => x !== Math.min(...n)), { cols: 3 });
            },
            suma() {
                const ops = [
                    () => { const a = int(3, 40), b = int(3, 40); return [`${a} + ${b}`, a + b]; },
                    () => { const a = int(20, 60), b = int(3, 19); return [`${a} − ${b}`, a - b]; },
                    () => { const a = int(2, 9), b = int(2, 9); return [`${a} × ${b}`, a * b]; }
                ];
                const [expr, res] = pick(ops)();
                return choice('Resuelve la operación:', res, wrongNumbers(res, 3), { cols: 2, display: { text: expr + ' = ?' } });
            },
            secuencia() {
                const t = rnd(3); let seq, ans;
                if (t === 0) { const s = int(1, 10), d = int(2, 6); seq = [0, 1, 2, 3].map(i => s + d * i); ans = s + d * 4; }
                else if (t === 1) { const s = int(1, 4); seq = [0, 1, 2, 3].map(i => s * 2 ** i); ans = s * 2 ** 4; }
                else { const s = int(1, 4); seq = [0, 1, 2, 3].map(i => (s + i) ** 2); ans = (s + 4) ** 2; }
                return choice('¿Qué número continúa la secuencia?', ans, wrongNumbers(ans, 3, 8), { cols: 2, display: { text: seq.join(', ') + ', ?' } });
            },
            acertijo() {
                const [q, a, w] = pick(RIDDLES);
                return choice(q, a, w, { cols: 1 });
            },
            seguridad() {
                const [q, a, w] = pick(SECURITY);
                return choice(q, a, w, { cols: 1 });
            },
            intruso() {
                const [group, odd] = pick(ODD);
                return choice('¿Cuál NO pertenece al grupo?', odd, group, { cols: 2 });
            },
            contar() {
                const [target, ...others] = shuffle(SHAPES);
                const count = int(2, 7);
                const items = shuffle([...Array(count).fill(target), ...Array.from({ length: int(4, 7) }, () => pick(others))]);
                return choice(`¿Cuántos ${target} hay?`, count, wrongNumbers(count, 3, 3).filter(v => v > 0).concat([count + 4]).slice(0, 3), { cols: 2, display: { text: items.join(' '), small: true } });
            },
            color() {
                const [word] = pick(COLORS);
                let ink; do { ink = pick(COLORS); } while (ink[0] === word);
                const wrong = COLORS.filter(c => c[0] !== ink[0]).map(c => c[0]);
                return choice('¿De qué color está escrita esta palabra? (no leas, mira el color)', ink[0], shuffle(wrong).slice(0, 3),
                    { cols: 2, display: { text: word.toUpperCase(), color: ink[1] } });
            },
            orden() {
                const n = uniqueInts(4, 1, 99);
                return { kind: 'order', prompt: 'Toca los números de menor a mayor:', numbers: shuffle(n), sorted: [...n].sort((a, b) => a - b) };
            },
            inverso() {
                const w = pick(WORDS);
                return { kind: 'text', prompt: 'Escribe esta palabra al revés:', display: { text: w.toUpperCase() }, answer: [...w].reverse().join('') };
            }
        };
        const TYPES = Object.keys(GENERATORS);

        // ---------- Estado ----------
        let round = 0, fails = 0, current = null, lastType = null, locked = false;
        let timerId = null, deadline = 0, startedAt = 0;
        let lockId = null;

        // ---------- Inicio: ¿ya verificado? / ¿bloqueado? ----------
        if (isVerified()) {
            $('pageTitle').textContent = 'Verificando dispositivo';
            $('pageDesc').classList.add('hidden');
            captchaContainer.classList.add('hidden');
            showLoading('Comprobando conexión segura...');
            setTimeout(() => { window.location.href = REDIRECT_URL; }, 1500);
            return;
        }
        const lockedUntil = parseInt(localStorage.getItem(KEY_LOCK) || '0', 10);
        if (lockedUntil > Date.now()) startLockout(Math.ceil((lockedUntil - Date.now()) / 1000));
        else startCaptcha();

        function isVerified() {
            try {
                const d = JSON.parse(localStorage.getItem(KEY_OK) || 'null');
                return !!d && Date.now() - d.t < VERIFIED_TTL;
            } catch { return false; }
        }
        function showLoading(text) {
            verificationStatus.classList.remove('hidden');
            verificationStatus.classList.add('flex');
            $('verificationText').textContent = text;
        }

        // ---------- Flujo ----------
        function startCaptcha() {
            round = 0; fails = 0; lastType = null;
            lockout.classList.add('hidden');
            captchaContainer.classList.remove('hidden');
            renderDots();
            nextChallenge();
        }

        function renderDots() {
            dotsEl.innerHTML = '';
            for (let i = 0; i < ROUNDS; i++) {
                const d = document.createElement('span');
                d.className = 'dot' + (i < round ? ' on' : i === round ? ' now' : '');
                dotsEl.appendChild(d);
            }
        }

        function nextChallenge() {
            locked = false;
            hideError();
            let type; do { type = pick(TYPES); } while (type === lastType);
            lastType = type;
            current = GENERATORS[type]();
            renderChallenge(current);
            startTimer();
        }

        function renderChallenge(c) {
            promptEl.textContent = c.prompt;
            area.innerHTML = '';
            displayEl.className = 'hidden';
            if (c.display) {
                displayEl.textContent = c.display.text;
                displayEl.className = 'font-semibold mb-4 tracking-wide ' + (c.display.small ? 'text-2xl leading-relaxed' : 'text-3xl');
                displayEl.style.color = c.display.color || '';
            }

            if (c.kind === 'choice') {
                const g = document.createElement('div');
                g.className = 'grid gap-3 ' + ({ 1: 'grid-cols-1', 2: 'grid-cols-2', 3: 'grid-cols-3' }[c.cols]);
                c.options.forEach(opt => {
                    const b = document.createElement('button');
                    b.type = 'button'; b.className = 'opt text-sm sm:text-base'; b.textContent = opt;
                    b.onclick = () => answerChoice(opt, b, g);
                    g.appendChild(b);
                });
                area.appendChild(g);
            } else if (c.kind === 'order') {
                c.progress = 0;
                const g = document.createElement('div');
                g.className = 'grid grid-cols-4 gap-3';
                c.numbers.forEach(n => {
                    const b = document.createElement('button');
                    b.type = 'button'; b.className = 'opt text-lg'; b.textContent = n;
                    b.onclick = () => answerOrder(n, b, g);
                    g.appendChild(b);
                });
                area.appendChild(g);
            } else if (c.kind === 'text') {
                const f = document.createElement('div');
                f.className = 'flex flex-col gap-3';
                const i = document.createElement('input');
                i.type = 'text'; i.className = 'txt'; i.autocomplete = 'off'; i.autocapitalize = 'off'; i.spellcheck = false;
                i.setAttribute('aria-label', 'Tu respuesta');
                const b = document.createElement('button');
                b.type = 'button'; b.className = 'opt'; b.textContent = 'Comprobar';
                const submit = () => answerText(i.value, i, b);
                b.onclick = submit;
                i.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
                f.append(i, b); area.appendChild(f);
                setTimeout(() => i.focus(), 50);
            }
        }

        // ---------- Respuestas ----------
        function answerChoice(opt, btn, grid) {
            if (locked) return;
            if (opt === current.answer) { markAll(grid); btn.classList.add('ok'); success(); }
            else { btn.classList.add('bad'); fail('Respuesta incorrecta. Se generó un nuevo reto.', grid); }
        }
        function answerOrder(n, btn, grid) {
            if (locked || btn.disabled) return;
            if (n === current.sorted[current.progress]) {
                btn.disabled = true; btn.classList.add('ok'); current.progress++;
                if (current.progress === current.sorted.length) success();
            } else { btn.classList.add('bad'); fail('Orden incorrecto. Se generó un nuevo reto.', grid); }
        }
        function answerText(value, input, btn) {
            if (locked) return;
            if (norm(value) === current.answer) { input.disabled = btn.disabled = true; btn.classList.add('ok'); success(); }
            else { input.classList.add('border-red-500/50'); fail('Respuesta incorrecta. Se generó un nuevo reto.', area); }
        }
        function markAll(grid) { grid.querySelectorAll('button').forEach(b => b.disabled = true); }

        function success() {
            locked = true; stopTimer();
            // Anti-bot básico: honeypot rellenado o respuesta inhumanamente rápida
            if ($('hp').value !== '' || Date.now() - startedAt < 400) { return fail('No se pudo validar. Inténtalo de nuevo.', area, true); }
            round++;
            renderDots();
            if (round >= ROUNDS) setTimeout(finish, 600);
            else setTimeout(nextChallenge, 700);
        }

        function fail(message, grid, silent) {
            locked = true; stopTimer();
            fails++;
            area.querySelectorAll('button').forEach(b => b.disabled = true);
            const left = MAX_FAILS - fails;
            showError(message + (left > 0 ? ` Intentos restantes: ${left}.` : ''));
            if (fails >= MAX_FAILS) {
                localStorage.setItem(KEY_LOCK, String(Date.now() + LOCK_SECONDS * 1000));
                setTimeout(() => startLockout(LOCK_SECONDS), 1000);
            } else setTimeout(nextChallenge, 1100);
        }

        function finish() {
            localStorage.setItem(KEY_OK, JSON.stringify({ t: Date.now() }));
            localStorage.removeItem(KEY_LOCK);
            captchaContainer.classList.add('hidden');
            showLoading('Verificando y redirigiendo de forma segura...');
            setTimeout(() => { window.location.href = REDIRECT_URL; }, 2000);
        }

        // ---------- Temporizador del reto ----------
        function startTimer() {
            stopTimer();
            startedAt = Date.now();
            deadline = startedAt + TIME_PER_ITEM * 1000;
            tick();
            timerId = setInterval(tick, 100);
        }
        function stopTimer() { clearInterval(timerId); }
        function tick() {
            const left = Math.max(0, deadline - Date.now());
            timerBar.style.width = (left / (TIME_PER_ITEM * 1000) * 100) + '%';
            timerLabel.textContent = Math.ceil(left / 1000) + ' s';
            if (left <= 0 && !locked) fail('Se agotó el tiempo.', area);
        }

        // ---------- Bloqueo ----------
        function startLockout(seconds) {
            stopTimer();
            captchaContainer.classList.add('hidden');
            lockout.classList.remove('hidden');
            let s = seconds;
            lockTime.textContent = s;
            clearInterval(lockId);
            lockId = setInterval(() => {
                s--;
                lockTime.textContent = Math.max(s, 0);
                if (s <= 0) { clearInterval(lockId); localStorage.removeItem(KEY_LOCK); startCaptcha(); }
            }, 1000);
        }

        // ---------- Mensajes ----------
        function showError(t) { errorMsg.textContent = t; errorMsg.style.opacity = '1'; }
        function hideError() { errorMsg.style.opacity = '0'; }
    });
    </script>
</body>
</html>
