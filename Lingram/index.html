<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../assets/auth/guard.js" data-service="lingram"></script>
<title>Lingram — Traductor de texto y voz | e-Onyx Technologies</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logos/Lingram/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/logos/Lingram/icon-192.png">
<link rel="apple-touch-icon" href="../assets/logos/Lingram/icon-180.png">
<meta name="description" content="Lingram es un servicio de traducción de texto con voz de e-Onyx Technologies.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo"><img class="logo-img" src="../assets/logos/Lingram/icon-64.png" width="34" height="34" alt="">Lingram</div>
  <button class="ico" id="theme" aria-label="Cambiar entre modo oscuro y claro" title="Cambiar tema"></button>
</header>

<main>
  <h1>Traduce escribiendo o hablando.</h1>
  <p class="lead">Lingram es un servicio de <b>e-Onyx Technologies</b>. Escribe o dicta tu texto, elige el idioma y escucha la traducción en voz alta.</p>

  <div class="bar">
    <select id="from" aria-label="Idioma de origen"></select>
    <button class="ico" id="swap" aria-label="Intercambiar idiomas" title="Intercambiar"><svg viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg></button>
    <select id="to" aria-label="Idioma de destino"></select>
  </div>

  <div class="grid">
    <div class="box">
      <textarea id="src" placeholder="Escribe o pulsa el micrófono para dictar…" maxlength="5000"></textarea>
      <div class="tools">
        <button class="ico" id="mic" aria-label="Dictar con el micrófono" title="Dictar"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="ico" id="spkSrc" aria-label="Escuchar texto original" title="Escuchar original"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM16 9a4 4 0 0 1 0 6"/></svg></button>
        <span class="sp"></span><span class="cnt" id="cnt">0 / 5000</span>
        <button class="ico" id="clear" aria-label="Borrar texto" title="Borrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </div>
    <div class="box out">
      <textarea id="dst" placeholder="La traducción aparecerá aquí" readonly></textarea>
      <div class="tools">
        <button class="ico" id="spkDst" aria-label="Escuchar traducción" title="Escuchar traducción"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
        <button class="ico" id="copy" aria-label="Copiar traducción" title="Copiar"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>
        <span class="sp"></span><span class="cnt" id="det"></span>
      </div>
    </div>
  </div>

  <button class="go" id="go">Traducir</button>

  <section class="hist">
    <h2>Historial <button id="clearHist">Borrar historial</button></h2>
    <div id="hist"></div>
  </section>
</main>

<footer>
  <span><b>Lingram</b> — un servicio de <b>e-Onyx Technologies</b></span>
  <span>© <span id="yr"></span> e-Onyx Technologies. Todos los derechos reservados.</span>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
