// --- UTILIDADES ---
const esc = (str) => String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const money = (n) => (Number(n) || 0).toFixed(2);
const uid = (prefix) => `${prefix}-${Date.now()}-${Math.floor(Math.random()*100000)}`;

// ==========================================================
// MÓDULO DE ACCESO: LOGIN / REGISTRO / RECUPERACIÓN
// Adaptado desde el portal de acceso de e-Onyx Technologies,
// integrado al mismo patrón de estado + render que usa App.
// ==========================================================
const AUTH_STORAGE_KEY = 'estock_auth_v1';

const Auth = {
  state: {
    mode: 'login', // 'login', 'signup' o 'forgot'
    toast: null,
    loginEmail: '',
    loginPassword: '',
    rememberMe: false,
    signupName: '',
    signupUsername: '',
    signupEmail: '',
    signupPassword: '',
    signupConfirm: '',
    signupRole: 'general',
    signupTerms: false,
    forgotEmail: ''
  },

  _toastTimeout: null,

  // --- NOTIFICACIONES TIPO TOAST DEL PORTAL DE ACCESO ---
  showToast(message) {
    this.state.toast = message;
    if (this._toastTimeout) clearTimeout(this._toastTimeout);
    this._toastTimeout = setTimeout(() => { this.state.toast = null; App.render(); }, 5000);
    App.render();
  },

  closeToast() {
    if (this._toastTimeout) clearTimeout(this._toastTimeout);
    this.state.toast = null;
    App.render();
  },

  // --- NAVEGACIÓN ENTRE SECCIONES ---
  switchSection(mode) {
    this.state.mode = mode;
    App.render();
  },

  // --- CAMPOS CONTROLADOS ---
  setLoginField(field, value) { this.state[field] = value; },
  setSignupField(field, value) { this.state[field] = value; App.render(); },
  setForgotField(field, value) { this.state[field] = value; },
  toggleRemember() { this.state.rememberMe = !this.state.rememberMe; },
  toggleTerms() { this.state.signupTerms = !this.state.signupTerms; App.render(); },

  // --- ANALIZADOR DE FORTALEZA DE CONTRASEÑA (ESTILO MONOCROMÁTICO) ---
  computeStrength(password) {
    if (!password) return { points: 0, label: 'Sin ingresar', className: '' };
    let points = 0;
    if (password.length >= 8) points++;
    if (/[A-Z]/.test(password)) points++;
    if (/[0-9]/.test(password)) points++;
    if (/[^A-Za-z0-9]/.test(password)) points++;

    const map = {
      1: { label: 'Débil ✗', className: 'weak' },
      2: { label: 'Aceptable ⚠', className: 'medium' },
      3: { label: 'Segura ✓', className: 'strong' },
      4: { label: 'Excelente !!', className: 'excellent' }
    };
    return { points, label: (map[points] || {}).label || 'Sin ingresar', className: (map[points] || {}).className || '' };
  },

  // --- PERSISTENCIA DE SESIÓN (equivalente al "Recuérdame") ---
  persistSession(email) {
    try {
      localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ isAuthenticated: true, email }));
    } catch (e) { console.error('Error guardando la sesión:', e); }
  },

  // --- MANEJO UNIFICADO DE ENVÍO DE FORMULARIO ---
  handleSubmit(e) {
    e.preventDefault();
    const mode = this.state.mode;

    if (mode === 'login') {
      const email = this.state.loginEmail;
      const password = this.state.loginPassword;
      if (!email || !password) {
        this.showToast('Ingresa tu correo y contraseña para continuar.');
        return;
      }
      App.state.isAuthenticated = true;
      App.state.currentUserEmail = email;
      if (this.state.rememberMe) this.persistSession(email);
      App.triggerNotification(`Sesión iniciada con éxito para: ${email}`);
    }
    else if (mode === 'signup') {
      const password = this.state.signupPassword;
      const confirm = this.state.signupConfirm;

      if (!this.state.signupTerms) {
        this.showToast('Debes aceptar los términos y condiciones de e-Onyx.');
        return;
      }
      if (password !== confirm) {
        this.showToast('Las contraseñas no coinciden.');
        return;
      }

      const user = this.state.signupUsername;
      const role = this.state.signupRole;
      this.showToast(`¡Registro Exitoso! Perfil: ${user} (${role})`);
      setTimeout(() => {
        this.state.signupName = '';
        this.state.signupUsername = '';
        this.state.signupEmail = '';
        this.state.signupPassword = '';
        this.state.signupConfirm = '';
        this.state.signupRole = 'general';
        this.state.signupTerms = false;
        this.switchSection('login');
      }, 2500);
    }
    else if (mode === 'forgot') {
      const email = this.state.forgotEmail;
      if (!email) {
        this.showToast('Ingresa un correo electrónico válido.');
        return;
      }
      this.showToast(`Código enviado. Revisa la bandeja de: ${email}`);
      setTimeout(() => {
        this.state.forgotEmail = '';
        this.switchSection('login');
      }, 3500);
    }
  },

  // --- ETIQUETAS DINÁMICAS SEGÚN LA SECCIÓN ACTIVA ---
  submitLabel() {
    if (this.state.mode === 'signup') return 'Crear Cuenta';
    if (this.state.mode === 'forgot') return 'Enviar Código de Verificación';
    return 'Iniciar Sesión';

  subtitleLabel() {
    if (this.state.mode === 'signup') return 'Crea tu perfil tecnológico empresarial';
    if (this.state.mode === 'forgot') return 'Recuperación de credenciales';
    return 'Accede a tu cuenta de servicios tecnológicos';

    if (this.state.mode === 'signup') {

    }
    return `¿No tienes una cuenta? <span class="span" onclick="Auth.switchSection('signup')">Regístrate</span>`;
  },

// ==========================================================
// ESTADO PRINCIPAL DE LA APLICACIÓN
// ==========================================================
const STORAGE_KEY = 'estock_data_v1';

const App = {
  state: {
    isAuthenticated: false,
    currentUserEmail: null,
    products: [],
    sales: [],
    purchases: [],
    activeTab: 'dashboard',
    cart: [],
    supplyCart: [],
    searchQuery: '',
    supplySearchQuery: '',
    categoryFilter: 'Todos',
    isModalOpen: false,
    editingProduct: null,
    productForm: { name: '', category: 'Bebidas', price: '', stock: '', sku: '' },
    confirmModal: { isOpen: false, title: '', message: '' },
    notification: null,
    dataSyncing: false
  },

  _confirmAction: null,
  _notifTimeout: null,

  // --- PERSISTENCIA LOCAL (equivalente a la sincronización en la nube) ---
  loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        this.state.products = parsed.products || [];
        this.state.sales = parsed.sales || [];
        this.state.purchases = parsed.purchases || [];
      }
    } catch (e) {
      console.error('Error cargando datos locales:', e);
    }
  },

  saveData() {
    this.state.dataSyncing = true;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        products: this.state.products,
        sales: this.state.sales,
        purchases: this.state.purchases
      }));
    } catch (e) {
      console.error('Error guardando datos locales:', e);
    }
    setTimeout(() => { this.state.dataSyncing = false; this.render(); }, 400);
  },

  // --- SESIÓN: CARGA Y CIERRE (integrado desde el portal de acceso e-Onyx) ---
  loadAuth() {
    try {
      const raw = localStorage.getItem(AUTH_STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.isAuthenticated) {
          this.state.isAuthenticated = true;
          this.state.currentUserEmail = parsed.email || null;
        }
      }
    } catch (e) {
      console.error('Error cargando la sesión:', e);
    }
  },

  handleLogout() {
    this.state.isAuthenticated = false;
    this.state.currentUserEmail = null;
    try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (e) { /* ignorar */ }
    Auth.state.loginPassword = '';
    Auth.state.mode = 'login';
    this.triggerNotification('Sesión cerrada con éxito.', 'info');
  },

  triggerNotification(message, type = 'success') {
    this.state.notification = { message, type };
    if (this._notifTimeout) clearTimeout(this._notifTimeout);
    this._notifTimeout = setTimeout(() => { this.state.notification = null; this.render(); }, 3000);
    this.render();
  },

  // --- 3. INICIALIZADOR DE DATOS DE DEMOSTRACIÓN (OPCIONAL) ---
  handleLoadDemoData() {
    this.state.confirmModal = {
      isOpen: true,
      title: 'Cargar Datos Demo',
      message: '¿Deseas poblar el inventario vacío con productos muestra para realizar pruebas rápidas?'
    };
    this._confirmAction = () => {
      try {
        this.state.products = demoProductsSeed.map((p) => ({ id: uid('local'), ...p }));
        this.saveData();
        this.triggerNotification('Datos demo cargados con éxito.');
      } catch (err) {
        this.triggerNotification('No se pudieron cargar los datos muestra.', 'error');
      }
      this.closeConfirmModal();
    };
    this.render();
  },

  // --- 4. OPERACIONES DE CONTROL DE INVENTARIO ---
  handleOpenAdd() {
    this.state.editingProduct = null;
    this.state.productForm = { name: '', category: 'Bebidas', price: '', stock: '', sku: '' };
    this.state.isModalOpen = true;
    this.render();
  },

  handleOpenEdit(id) {
    const product = this.state.products.find(p => p.id === id);
    if (!product) return;
    this.state.editingProduct = product;
    this.state.productForm = {
      name: product.name,
      category: product.category || 'Otros',
      price: product.price.toString(),
      stock: product.stock.toString(),
      sku: product.sku
    };
    this.state.isModalOpen = true;
    this.render();
  },

  handleSelectMarcaSugerida(brandName) {
    const name = this.state.productForm.name;
    if (!name.toLowerCase().includes(brandName.toLowerCase())) {
      this.state.productForm.name = name ? `${name} ${brandName}` : brandName;
      this.render();
    }
  },

  handleConfirmDelete(id, name) {
    this.state.confirmModal = {
      isOpen: true,
      title: 'Eliminar del Inventario',
      message: `¿Estás seguro de que deseas eliminar permanentemente "${name}" del catálogo?`
    };
    this._confirmAction = () => {
      try {
        this.state.products = this.state.products.filter(p => p.id !== id);
        this.state.cart = this.state.cart.filter(item => item.product.id !== id);
        this.state.supplyCart = this.state.supplyCart.filter(item => item.product.id !== id);
        this.saveData();
        this.triggerNotification('Producto dado de baja con éxito', 'info');
      } catch (err) {
        this.triggerNotification('No se pudo borrar el artículo.', 'error');
      }
      this.closeConfirmModal();
    };
    this.render();
  },

  handleSaveProduct(e) {
    e.preventDefault();
    const form = this.state.productForm;
    if (!form.name || !form.price || !form.stock) {
      this.triggerNotification('Por favor, completa los campos obligatorios.', 'error');
      return;
    }

    const priceNum = parseFloat(form.price);
    const stockNum = parseInt(form.stock);

    if (isNaN(priceNum) || priceNum <= 0) {
      this.triggerNotification('El precio debe ser superior a $0.00', 'error');
      return;
    }
    if (isNaN(stockNum) || stockNum < 0) {
      this.triggerNotification('El stock inicial no puede ser negativo.', 'error');
      return;
    }

    const productPayload = {
      name: form.name.trim(),
      category: form.category || 'Otros',
      price: priceNum,
      stock: stockNum,
      sku: form.sku || `SKU-${Math.floor(Math.random() * 10000)}`
    };

    try {
      const editingProduct = this.state.editingProduct;
      if (editingProduct) {
        this.state.products = this.state.products.map(p => p.id === editingProduct.id ? { ...p, ...productPayload } : p);
      } else {
        this.state.products.push({ id: uid('local'), ...productPayload });
      }
      this.saveData();
      this.triggerNotification(editingProduct ? 'Producto actualizado' : 'Nuevo producto registrado con éxito');
      this.state.isModalOpen = false;
      this.render();
    } catch (err) {
      this.triggerNotification('Error al intentar guardar en base de datos.', 'error');
    }
  },

  // --- 5. CONTROL DE PUNTO DE VENTA (VENTAS A CLIENTES) ---
  handleAddToCart(id) {
    const product = this.state.products.find(p => p.id === id);
    if (!product) return;
    if (product.stock <= 0) {
      this.triggerNotification('Este producto se encuentra agotado actualmente.', 'error');
      return;
    }

    const existingCartItem = this.state.cart.find(item => item.product.id === product.id);

    if (existingCartItem) {
      if (existingCartItem.quantity >= product.stock) {
        this.triggerNotification(`Alcanzaste el límite de stock (${product.stock} unidades).`, 'error');
        return;
      }
      this.state.cart = this.state.cart.map(item =>
        item.product.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
      );
    } else {
      this.state.cart.push({ product, quantity: 1 });
    }
    this.render();
  },

  handleUpdateCartQuantity(productId, newQty) {
    const product = this.state.products.find(p => p.id === productId);
    if (!product) return;

    if (newQty <= 0) {
      this.state.cart = this.state.cart.filter(item => item.product.id !== productId);
      this.render();
      return;
    }

    if (newQty > product.stock) {
      this.triggerNotification(`Solo hay ${product.stock} piezas disponibles en almacén.`, 'error');
      return;
    }

    this.state.cart = this.state.cart.map(item =>
      item.product.id === productId ? { ...item, quantity: newQty } : item
    );
    this.render();
  },

  handleCheckout() {
    if (this.state.cart.length === 0) {
      this.triggerNotification('El carrito de compras se encuentra vacío.', 'error');
      return;
    }

    const total = this.state.cart.reduce((a, c) => a + (c.product.price * c.quantity), 0);
    this.state.confirmModal = {
      isOpen: true,
      title: 'Confirmar Venta y Cobro',
      message: `Estás a punto de procesar el cobro por un total de $${money(total)}. ¿Deseas finalizar la venta?`
    };
    this._confirmAction = () => {
      try {
        const todayStr = new Date().toISOString().split('T')[0];
        const timeStr = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
        const totalAmt = this.state.cart.reduce((acc, item) => acc + (item.product.price * item.quantity), 0);

        const salePayload = {
          id: uid('V'),
          date: todayStr,
          time: timeStr,
          items: this.state.cart.map(item => ({
            id: item.product.id, name: item.product.name, quantity: item.quantity, price: item.product.price
          })),
          total: totalAmt
        };

        this.state.sales = [salePayload, ...this.state.sales];
        this.state.products = this.state.products.map(p => {
          const cartItem = this.state.cart.find(item => item.product.id === p.id);
          return cartItem ? { ...p, stock: Math.max(0, p.stock - cartItem.quantity) } : p;
        });

        this.state.cart = [];
        this.saveData();
        this.triggerNotification('Venta registrada y stock descontado con éxito.');
      } catch (err) {
        this.triggerNotification('Error procesando la venta.', 'error');
      }
      this.closeConfirmModal();
    };
    this.render();
  },

  // --- 6. CONTROL DE ABASTECIMIENTO / SUMINISTROS (COMPRAS) ---
  handleAddToSupplyCart(id) {
    const product = this.state.products.find(p => p.id === id);
    if (!product) return;
    const existingItem = this.state.supplyCart.find(item => item.product.id === product.id);
    if (existingItem) {
      this.state.supplyCart = this.state.supplyCart.map(item =>
        item.product.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
      );
    } else {
      const suggestedCost = Math.round((product.price * 0.7) * 100) / 100;
      this.state.supplyCart.push({ product, quantity: 1, cost: suggestedCost });
    }
    this.triggerNotification(`Añadido a lista de suministro: ${product.name}`);
  },

  handleUpdateSupplyItem(productId, field, value) {
    this.state.supplyCart = this.state.supplyCart.map(item => {
      if (item.product.id === productId) {
        return { ...item, [field]: field === 'quantity' ? (parseInt(value) || 0) : (parseFloat(value) || 0) };
      }
      return item;
    });
    this.render();
  },

  handleConfirmPurchase() {
    if (this.state.supplyCart.length === 0) {
      this.triggerNotification('Agrega por lo menos un producto para registrar la compra.', 'error');
      return;
    }

    const hasErrors = this.state.supplyCart.some(item => item.quantity <= 0 || item.cost <= 0);
    if (hasErrors) {
      this.triggerNotification('La cantidad y el costo deben ser mayores a cero.', 'error');
      return;
    }

    const total = this.state.supplyCart.reduce((a, c) => a + (c.cost * c.quantity), 0);
    this.state.confirmModal = {
      isOpen: true,
      title: 'Confirmar Compra a Proveedor',
      message: `Estás a punto de ingresar mercancía por un total de $${money(total)}. ¿Deseas aplicar estos cambios en el almacén?`
    };
    this._confirmAction = () => {
      try {
        const todayStr = new Date().toISOString().split('T')[0];
        const timeStr = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
        const totalAmt = this.state.supplyCart.reduce((acc, item) => acc + (item.cost * item.quantity), 0);

        const purchasePayload = {
          id: uid('C'),
          date: todayStr,
          time: timeStr,
          items: this.state.supplyCart.map(item => ({
            id: item.product.id, name: item.product.name, quantity: item.quantity, cost: item.cost
          })),
          total: totalAmt
        };

        this.state.purchases = [purchasePayload, ...this.state.purchases];
        this.state.products = this.state.products.map(p => {
          const supplyItem = this.state.supplyCart.find(item => item.product.id === p.id);
          return supplyItem ? { ...p, stock: p.stock + supplyItem.quantity } : p;
        });

        this.state.supplyCart = [];
        this.saveData();
        this.triggerNotification('Stock incrementado y compra registrada con éxito.');
      } catch (err) {
        this.triggerNotification('Error registrando compras en base de datos.', 'error');
      }
      this.closeConfirmModal();
    };
    this.render();
  },

  // --- 7. ANULAR / REVERTIR COMPRA CONFIRMADA ---
  handleCancelPurchase(purchaseId) {
    const purchase = this.state.purchases.find(p => p.id === purchaseId);
    if (!purchase) return;
    this.state.confirmModal = {
      isOpen: true,
      title: 'Anular Surtido de Proveedor',
      message: `Estás a punto de anular por completo la compra "${purchase.id}" por un monto de $${money(purchase.total)}. Se descontarán las cantidades adquiridas del almacén actual. ¿Deseas continuar?`
    };
    this._confirmAction = () => {
      try {
        this.state.purchases = this.state.purchases.filter(p => p.id !== purchase.id);
        this.state.products = this.state.products.map(p => {
          const itemInPurchase = purchase.items.find(item => item.id === p.id);
          if (itemInPurchase) {
            return { ...p, stock: Math.max(0, p.stock - itemInPurchase.quantity) };
          }
          return p;
        });
        this.saveData();
        this.triggerNotification('Compra anulada y existencias reajustadas.', 'info');
      } catch (err) {
        this.triggerNotification('Error al intentar anular la compra.', 'error');
      }
      this.closeConfirmModal();
    };
    this.render();
  },

  // --- NAVEGACIÓN Y FILTROS ---
  setActiveTab(tab) {
    this.state.activeTab = tab;
    if (tab === 'supply') this.state.supplySearchQuery = '';
    this.render();
  },
  setSearchQuery(val) { this.state.searchQuery = val; this.render(); },
  setSupplySearchQuery(val) { this.state.supplySearchQuery = val; this.render(); },
  setCategoryFilter(val) { this.state.categoryFilter = val; this.render(); },
  setProductFormField(field, val) { this.state.productForm[field] = val; this.render(); },

  closeModal() { this.state.isModalOpen = false; this.render(); },
  closeConfirmModal() {
    this.state.confirmModal = { isOpen: false, title: '', message: '' };
    this._confirmAction = null;
    this.render();
  },
  runConfirmAction() { if (this._confirmAction) this._confirmAction(); },

  clearCart() { this.state.cart = []; this.render(); },
  clearSupplyCart() { this.state.supplyCart = []; this.render(); },
  removeSupplyItem(id) { this.state.supplyCart = this.state.supplyCart.filter(x => x.product.id !== id); this.render(); }
};

// ==========================================================
// 8. CÁLCULO DE MÉTRICAS Y FILTROS EN MEMORIA
// ==========================================================
App.computeFilteredProducts = function() {
  const { products, searchQuery, categoryFilter } = this.state;
  return products.filter(p => {
    const matchesSearch = (p.name || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                          (p.sku || '').toLowerCase().includes(searchQuery.toLowerCase());
    const matchesCategory = categoryFilter === 'Todos' || p.category === categoryFilter;
    return matchesSearch && matchesCategory;
  });
};

App.computeFilteredProductsForSupply = function() {
  const { products, supplySearchQuery } = this.state;
  if (!supplySearchQuery) return [];
  return products.filter(p =>
    (p.name || '').toLowerCase().includes(supplySearchQuery.toLowerCase()) ||
    (p.sku || '').toLowerCase().includes(supplySearchQuery.toLowerCase())
  ).slice(0, 5);
};

App.computeCategories = function() {
  const list = new Set(this.state.products.map(p => p.category).filter(Boolean));
  return ['Todos', ...Array.from(list)];
};

App.computeLowStockProducts = function() {
  return this.state.products.filter(p => p.stock <= 5);
};

App.computeStats = function() {
  const { sales, purchases, products } = this.state;
  const lowStockProducts = this.computeLowStockProducts();
  const todayStr = new Date().toISOString().split('T')[0];
  const todaySales = sales.filter(s => s.date === todayStr);
  const todayPurchases = purchases.filter(p => p.date === todayStr);

  const totalTodayRevenue = todaySales.reduce((acc, s) => acc + s.total, 0);
  const totalTodayInvestment = todayPurchases.reduce((acc, p) => acc + p.total, 0);

  return {
    todayRevenue: totalTodayRevenue,
    todayCount: todaySales.length,
    todayInvestment: totalTodayInvestment,
    totalProducts: products.length,
    lowStockCount: lowStockProducts.length,
  };
};

App.computeHistoryByDay = function() {
  const { sales, purchases } = this.state;
  const groups = {};

  sales.forEach(sale => {
    if (!groups[sale.date]) {
      groups[sale.date] = { date: sale.date, salesTotal: 0, purchasesTotal: 0, sales: [], purchases: [] };
    }
    groups[sale.date].salesTotal += sale.total;
    groups[sale.date].sales.push(sale);
  });

  purchases.forEach(purchase => {
    if (!groups[purchase.date]) {
      groups[purchase.date] = { date: purchase.date, salesTotal: 0, purchasesTotal: 0, sales: [], purchases: [] };
    }
    groups[purchase.date].purchasesTotal += purchase.total;
    groups[purchase.date].purchases.push(purchase);
  });

  return Object.values(groups).sort((a, b) => b.date.localeCompare(a.date));
};

// ==========================================================
// RENDERIZADO CON PRESERVACIÓN DE FOCO EN INPUTS
// ==========================================================
App.render = function() {
  const root = document.getElementById('root');

  // Preservar foco / selección del input activo antes de re-renderizar
  const active = document.activeElement;
  let focusInfo = null;
  if (active && active.id && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) {
    focusInfo = {
      id: active.id,
      selectionStart: active.selectionStart,
      selectionEnd: active.selectionEnd
    };
  }

  root.innerHTML = this.state.isAuthenticated ? this.renderApp() : Auth.renderAuthScreen();

  if (focusInfo) {
    const el = document.getElementById(focusInfo.id);
    if (el) {
      el.focus();
      try {
        if (typeof focusInfo.selectionStart === 'number' && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
          el.setSelectionRange(focusInfo.selectionStart, focusInfo.selectionEnd);
        }
      } catch (e) { /* algunos tipos de input no soportan selección */ }
    }
  }
};

  const s = this.state;
  const cartTotal = s.cart.reduce((a, c) => a + (c.product.price * c.quantity), 0);

  return `

      <!-- Buscador Venta -->
      <div class="lg:col-span-7 space-y-4">
        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3">

          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">${IconSearch()}</span>
            <input type="text" id="input-pos-search" placeholder="Filtrar por nombre..." value="${esc(s.searchQuery)}" oninput="App.setSearchQuery(this.value)"
              class="w-full sm:w-64 bg-white border border-slate-200 rounded-2xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition" />
          </div>
        </div>

        <!-- Grid Catálogo -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          ${s.products.length === 0 ? `
            <div class="col-span-full bg-white p-12 text-center rounded-3xl border border-slate-150">
              <p class="text-md font-bold text-slate-600">Catálogo de ventas vacío</p>
              <p class="text-xs text-slate-400 mt-1">Registra productos en la pestaña de Almacén para poder cobrarlos aquí.</p>
            </div>
          ` : s.products.filter(p => (p.name || '').toLowerCase().includes(s.searchQuery.toLowerCase())).map(product => {
            const isInCart = s.cart.find(item => item.product.id === product.id);
            const currentCartQty = isInCart ? isInCart.quantity : 0;
            const availableToSelect = product.stock - currentCartQty;
            const disabledCard = product.stock <= 0 || availableToSelect === 0;

            return `
              <div onclick="${availableToSelect > 0 ? `App.handleAddToCart('${product.id}')` : ''}"
                class="p-4 rounded-2xl border transition-all text-left flex flex-col justify-between h-36 ${
                  product.stock <= 0 ? 'bg-slate-100 border-slate-200 opacity-60 cursor-not-allowed' :
                  availableToSelect === 0 ? 'bg-amber-50/50 border-amber-200 cursor-not-allowed' :
                  'bg-white border-slate-200 hover:border-emerald-500 hover:shadow-sm cursor-pointer'
                }">
                <div>
                  <div class="flex justify-between items-start gap-1">
                    <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-mono">${esc(product.sku)}</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded ${product.stock <= 0 ? 'bg-rose-100 text-rose-800' : product.stock <= 5 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">${product.stock} disp.</span>
                  </div>
                  <h4 class="font-extrabold text-slate-800 text-sm mt-2 line-clamp-2">${esc(product.name)}</h4>
                </div>
                <div class="flex justify-between items-center mt-2">
                  <span class="text-base font-black text-slate-900">$${money(product.price)}</span>
                  ${currentCartQty > 0 ? `<span class="bg-emerald-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-lg font-sans">${currentCartQty} en caja</span>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <!-- Detalle Ticket -->
      <div class="lg:col-span-5 bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col h-[calc(100vh-140px)] min-h-[500px]">
        <div class="flex justify-between items-center pb-4 border-b border-slate-100">
          <h3 class="text-md font-bold text-slate-900 flex items-center gap-2 font-sans">${IconPOS()}Canasta de Venta</h3>
          ${s.cart.length > 0 ? `<button onclick="App.clearCart()" class="text-xs font-bold text-rose-500 hover:text-rose-600 px-2 py-1 rounded-lg">Vaciar</button>` : ''}
        </div>

        <div class="flex-1 overflow-y-auto py-4 space-y-3">
          ${s.cart.length === 0 ? `
            <div class="h-full flex flex-col items-center justify-center text-slate-400 space-y-2">
              <p class="text-sm font-semibold">Caja lista para facturar</p>
              <p class="text-xs text-center px-4">Haz clic en los artículos de la izquierda para preparar la venta del cliente.</p>
            </div>
          ` : s.cart.map(item => `
            <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl gap-2">
              <div class="flex-1 min-w-0">
                <p class="font-bold text-slate-900 text-sm truncate">${esc(item.product.name)}</p>
                <p class="text-xs text-slate-400">$${money(item.product.price)} c/u</p>
              </div>

              <div class="flex items-center gap-1 bg-white border border-slate-200 rounded-xl px-2 py-1">
                <button onclick="App.handleUpdateCartQuantity('${item.product.id}', ${item.quantity - 1})" class="font-black text-slate-400 hover:text-rose-600 px-1.5">-</button>
                <span class="font-extrabold text-sm text-slate-900 min-w-[20px] text-center font-sans">${item.quantity}</span>
                <button onclick="App.handleUpdateCartQuantity('${item.product.id}', ${item.quantity + 1})" class="font-black text-slate-400 hover:text-emerald-600 px-1.5">+</button>
              </div>

              <div class="text-right pl-2 min-w-[65px]">
                <p class="font-black text-slate-900 text-sm">$${money(item.product.price * item.quantity)}</p>
              </div>
            </div>
          `).join('')}
        </div>

        <!-- Totales -->
        <div class="border-t border-slate-100 pt-4 space-y-4">
          <div class="flex justify-between items-center text-slate-400 text-xs font-bold uppercase tracking-wider font-sans">
            <span>Monto Total</span>
            <span>$${money(cartTotal)}</span>
          </div>
          <div class="flex justify-between items-center pt-2 border-t border-dashed border-slate-200">
            <span class="text-slate-900 font-extrabold text-base">Monto Neto a Cobrar</span>
            <span class="text-2xl font-black text-slate-900">$${money(cartTotal)}</span>
          </div>

          <button onclick="App.handleCheckout()" ${s.cart.length === 0 ? 'disabled' : ''}
            class="w-full py-3.5 rounded-2xl font-bold text-center tracking-wide shadow-md transition-all ${s.cart.length === 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed shadow-none' : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 hover:shadow-lg'}">
            Registrar Cobro Completo
          </button>
        </div>
      </div>

    </div>
  `;
};

// ==========================================================
// PESTAÑA: HISTORIAL DIARIO (UNIFICADO Y ANULABLE)
// ==========================================================
App.renderHistory = function() {
  const historyByDay = this.computeHistoryByDay();

  return `
    <div class="space-y-6 animate-fadeIn">
      <div>
        <h2 class="text-xl font-extrabold text-slate-900 md:text-2xl font-sans">Bitácora e Historial Diario</h2>
        <p class="text-sm text-slate-500">Supervisa de forma diaria los ingresos de caja y las facturas de surtido de proveedores.</p>
      </div>

      <div class="space-y-6">
        ${historyByDay.length === 0 ? `
          <div class="bg-white p-12 rounded-3xl shadow-sm border border-slate-100 text-center text-slate-400">
            <p class="text-lg font-semibold">No se registran actividades</p>
            <p class="text-xs mt-1">Registra transacciones para habilitar el reporte diario de caja.</p>
          </div>
        ` : historyByDay.map(dayGroup => {
          const dateFormatted = new Date(dayGroup.date + 'T00:00:00').toLocaleDateString('es-MX', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
          });
          const dailyBalance = dayGroup.salesTotal - dayGroup.purchasesTotal;

          return `
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
              <!-- Cabecera de fecha -->
              <div class="bg-slate-950 text-white px-6 py-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                  <h3 class="font-extrabold text-base capitalize font-sans">${dateFormatted}</h3>
                  <div class="flex flex-wrap gap-x-4 gap-y-1 mt-1 text-xs text-slate-400 font-medium">
                    <span>Ingresos: <strong class="text-emerald-400">${dayGroup.sales.length} ventas</strong></span>
                    <span>Surtidos: <strong class="text-amber-400">${dayGroup.purchases.length} facturas</strong></span>
                  </div>
                </div>

                <!-- Balance de Caja -->
                <div class="text-left md:text-right">
                  <p class="text-[10px] text-slate-400 uppercase tracking-wider font-extrabold">Flujo Neto Diario</p>
                  <p class="text-xl font-black ${dailyBalance >= 0 ? 'text-emerald-400' : 'text-rose-450'}">
                    ${dailyBalance >= 0 ? '+' : '-'}$${money(Math.abs(dailyBalance))}
                  </p>
                </div>
              </div>

              <!-- Contenido dividido -->
              <div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 bg-slate-50/40">

                <!-- Ventas -->
                <div class="space-y-3">
                  <h4 class="text-xs font-bold text-emerald-600 uppercase tracking-wider flex items-center gap-1.5 border-b border-emerald-100 pb-2">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full inline-block"></span>
                    Cobros de Caja (+$${money(dayGroup.salesTotal)})
                  </h4>

                  ${dayGroup.sales.length === 0 ? `<p class="text-xs text-slate-400 italic py-2">No se registraron cobros de caja este día.</p>` :
                    dayGroup.sales.map(sale => `
                      <div class="p-4 bg-white border border-slate-150 rounded-2xl space-y-2 shadow-xs animate-fadeIn">
                        <div class="flex justify-between items-center text-xs">
                          <strong class="text-slate-900">${sale.id}</strong>
                          <span class="text-slate-450">${sale.time} hrs</span>
                        </div>
                        <div class="text-xs text-slate-600 pl-2 border-l-2 border-emerald-200 space-y-1">
                          ${sale.items.map(item => `<p>${item.quantity}x ${esc(item.name)} ($${money(item.price)} c/u)</p>`).join('')}
                        </div>
                        <div class="text-right text-xs font-black text-slate-900 pt-1">Cobrado: $${money(sale.total)}</div>
                      </div>
                    `).join('')
                  }
                </div>

                <!-- Compras (Anulables) -->
                <div class="space-y-3">
                  <h4 class="text-xs font-bold text-amber-600 uppercase tracking-wider flex items-center gap-1.5 border-b border-amber-100 pb-2">
                    <span class="w-2 h-2 bg-amber-500 rounded-full inline-block"></span>
                    Pagos de Facturas (-$${money(dayGroup.purchasesTotal)})
                  </h4>

                  ${dayGroup.purchases.length === 0 ? `<p class="text-xs text-slate-400 italic py-2">No se registraron ingresos de proveedor este día.</p>` :
                    dayGroup.purchases.map(purchase => `
                      <div class="p-4 bg-white border border-slate-150 rounded-2xl space-y-2 shadow-xs relative animate-fadeIn">
                        <div class="flex justify-between items-center text-xs">
                          <div class="flex items-center gap-2">
                            <strong class="text-slate-900">${purchase.id}</strong>
                            <span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold uppercase font-sans">Confirmada</span>
                          </div>
                          <span class="text-slate-450">${purchase.time} hrs</span>
                        </div>
                        <div class="text-xs text-slate-600 pl-2 border-l-2 border-amber-200 space-y-1">
                          ${purchase.items.map(item => `<p>${item.quantity}x ${esc(item.name)} ($${money(item.cost)} cost c/u)</p>`).join('')}
                        </div>

                        <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                          <button onclick="App.handleCancelPurchase('${purchase.id}')" class="flex items-center gap-1 text-rose-600 hover:text-rose-800 text-[11px] font-bold px-2 py-1 bg-rose-50 hover:bg-rose-100 rounded-lg transition" title="Anular compra y descontar stock">
                            ${IconUndo()}<span>Anular Compra</span>
                          </button>
                          <div class="text-right text-xs font-black text-slate-900">Total: $${money(purchase.total)}</div>
                        </div>
                      </div>
                    `).join('')
                  }
                </div>

              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
};

// ==========================================================
// PANEL DE INICIALIZACIÓN MUESTRA (DESACTÍVALO SI NO LO USAS)
// ==========================================================
App.renderDemoPanel = function() {
  return `
    <div class="mt-8 border border-slate-200 bg-white p-6 rounded-3xl shadow-sm text-center max-w-xl mx-auto space-y-3">
      <h4 class="text-sm font-bold text-slate-800 font-sans">¿Quieres probar la app rápidamente antes de capturar tu catálogo?</h4>
      <p class="text-xs text-slate-500 leading-relaxed">
        Puedes cargar 5 productos muestra automáticamente para realizar tus primeras simulaciones de ventas o compras. Esto es completamente opcional.
      </p>
      <button onclick="App.handleLoadDemoData()" class="inline-flex items-center gap-1.5 bg-sky-50 hover:bg-sky-100 border border-sky-200 text-sky-700 font-bold px-4 py-2 rounded-xl text-xs transition">
        Cargar productos demo para probar
      </button>
    </div>
  `;
};

// ==========================================================
// MODAL PERSONALIZADO: CONFIRMACIÓN DE ACCIONES
// ==========================================================
App.renderConfirmModal = function() {
  const cm = this.state.confirmModal;
  if (!cm.isOpen) return '';
  return `
    <div class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
      <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 border border-slate-100 space-y-4">
        <div class="flex items-center gap-2.5 text-amber-600">
          ${IconAlert()}
          <h3 class="font-extrabold text-slate-900 text-md font-sans">${esc(cm.title)}</h3>
        </div>
        <p class="text-xs text-slate-500 leading-relaxed">${esc(cm.message)}</p>
        <div class="flex gap-3 pt-2">
          <button onclick="App.closeConfirmModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-2xl text-xs transition animate-all">No, cancelar</button>
          <button onclick="App.runConfirmAction()" class="flex-1 bg-slate-950 hover:bg-slate-900 text-white font-bold py-2.5 rounded-2xl text-xs transition animate-all">Sí, proceder</button>
        </div>
      </div>
    </div>
  `;
};

// ==========================================================
// MODAL: REGISTRAR / EDITAR PRODUCTO CON MARCAS
// ==========================================================
App.renderProductModal = function() {
  const s = this.state;
  if (!s.isModalOpen) return '';
  const form = s.productForm;
  const marcas = MARCAS_SUGERIDAS[form.category];

  const categoryOptions = ['Bebidas', 'Botanas', 'Lácteos', 'Limpieza', 'Panadería'];

  return `
    <div class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
      <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-100 max-h-[90vh] flex flex-col">

        <div class="bg-slate-950 text-white px-6 py-4 flex justify-between items-center flex-shrink-0">
          <h3 class="font-extrabold text-base font-sans">${s.editingProduct ? 'Modificar Información' : 'Registrar en Inventario'}</h3>
          <button onclick="App.closeModal()" class="text-slate-400 hover:text-white transition font-black text-lg">✕</button>
        </div>

        <form onsubmit="App.handleSaveProduct(event)" class="p-6 space-y-4 overflow-y-auto flex-1">

          <!-- Categoría / Pasillo -->
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 font-sans">Categoría / Pasillo</label>
            <select id="modal-category" onchange="App.setProductFormField('category', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition font-medium">
              ${categoryOptions.map(cat => `<option value="${cat}" ${form.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}
              <option value="Otros" ${form.category === 'Otros' ? 'selected' : ''}>Otros (General)</option>
            </select>
          </div>

          <!-- LISTADO DE MARCAS SUGERIDAS DINÁMICO -->
          ${marcas ? `
            <div class="bg-emerald-50/50 border border-emerald-100 p-4 rounded-2xl space-y-2 animate-fadeIn">
              <span class="text-[10px] font-bold text-emerald-700 uppercase tracking-wider block font-sans">Marcas populares en ${form.category} (Toca para agregar al nombre):</span>
              <div class="flex flex-wrap gap-1.5 max-h-[85px] overflow-y-auto pr-1">
                ${marcas.map(marca => `<button type="button" onclick="App.handleSelectMarcaSugerida('${marca.replace(/'/g, "\\'")}')" class="bg-white border border-emerald-200 text-emerald-850 hover:bg-emerald-500 hover:text-slate-950 font-bold text-[10px] px-2.5 py-1 rounded-full transition shadow-xs font-sans">${esc(marca)}</button>`).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Nombre o Descripción -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 font-sans">Nombre o Descripción *</label>
              <span class="text-[10px] text-slate-450 italic">Ej: Refresco de Cola 2.5 L</span>
            </div>
            <input type="text" required id="modal-name" placeholder="Escribe la descripción del producto..." value="${esc(form.name)}" oninput="App.setProductFormField('name', this.value)"
              class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition font-medium" />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 font-sans">Precio Venta Público ($) *</label>
              <input type="number" step="0.01" required id="modal-price" placeholder="0.00" value="${esc(form.price)}" oninput="App.setProductFormField('price', this.value)"
                class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition font-bold" />
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 font-sans">Stock Inicial *</label>
              <input type="number" required id="modal-stock" placeholder="0" value="${esc(form.stock)}" oninput="App.setProductFormField('stock', this.value)"
                class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition font-bold" />
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 font-sans">Código de Barras / SKU</label>
            <input type="text" id="modal-sku" placeholder="Vacío para autogenerar" value="${esc(form.sku)}" oninput="App.setProductFormField('sku', this.value)"
              class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition font-mono" />
          </div>

          <p class="text-[10px] text-slate-400 italic">Los datos marcados con (*) son obligatorios.</p>

          <div class="flex gap-3 pt-4 border-t border-slate-100 flex-shrink-0">
            <button type="button" onclick="App.closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-2xl text-xs transition">Cancelar</button>
            <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-2xl text-xs transition">${s.editingProduct ? 'Guardar Cambios' : 'Dar de Alta'}</button>
          </div>
        </form>

      </div>
    </div>
  `;
};

// ==========================================================
// INICIALIZACIÓN
// ==========================================================
App.loadAuth();
App.loadData();
App.render();
</script>
</body>
</html>
