<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eDocument Editor — PDF y Word en tu navegador</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
<div class="flex min-h-screen">
  <aside class="w-16 md:w-60 shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col">
    <div class="p-4 flex items-center gap-2 font-bold text-lg"><span class="text-2xl">📄</span><span class="hidden md:inline">e<span class="text-indigo-600">Document</span> Editor</span></div>
    <nav id="nav" class="flex-1 px-2 space-y-1 text-sm"></nav>
    <button id="theme" class="m-3 rounded-lg border border-slate-200 dark:border-slate-700 py-2 text-sm">🌓 <span class="hidden md:inline">Tema</span></button>
  </aside>
  <main class="flex-1 p-4 md:p-8 max-w-4xl">
    <header class="mb-6 flex items-center justify-between">
      <h1 id="title" class="text-2xl font-bold"></h1>
      <button onclick="openPricing()" class="rounded-full bg-gradient-to-r from-indigo-600 to-fuchsia-600 text-white text-sm font-semibold px-4 py-2 shadow-lg hover:opacity-90">⚡ Hazte PRO</button>
    </header>
    <p class="mb-4 text-xs text-emerald-600 dark:text-emerald-400">🔒 Tus archivos nunca salen de tu navegador en las herramientas gratuitas.</p>

    <section data-view="merge" class="hidden space-y-4">
      <div class="dz" data-accept=".pdf" data-multi="1" id="dzMerge"></div>
      <ul id="mergeList" class="space-y-2"></ul>
      <button class="btn" onclick="doMerge()">Unir y descargar</button>
    </section>

    <section data-view="split" class="hidden space-y-4">
      <div class="dz" data-accept=".pdf" id="dzSplit"></div>
      <p id="splitInfo" class="text-sm opacity-70"></p>
      <input id="range" class="inp" placeholder="Rango de páginas, ej: 1-3,5,8-10">
      <button class="btn" onclick="doSplit()">Extraer y descargar</button>
    </section>

    <section data-view="img" class="hidden space-y-4">
      <div class="dz" data-accept=".jpg,.jpeg,.png,.webp" data-multi="1" id="dzImg"></div>
      <ul id="imgList" class="space-y-2"></ul>
      <button class="btn" onclick="doImg()">Crear PDF</button>
    </section>

    <section data-view="gen" class="hidden space-y-3">
      <input id="gName" class="inp" placeholder="Nombre">
      <input id="gTitle" class="inp" placeholder="Título del documento">
      <input id="gDate" type="date" class="inp">
      <textarea id="gBody" rows="8" class="inp" placeholder="Contenido / Notas (una línea = un párrafo)"></textarea>
      <button class="btn" onclick="doGen()">Generar .docx</button>
    </section>

    <section data-view="read" class="hidden space-y-4">
      <div class="dz" data-accept=".docx" id="dzRead"></div>
      <div id="docOut" class="bg-white dark:bg-slate-900 rounded-xl p-6 shadow border border-slate-200 dark:border-slate-800 hidden [&_h1]:text-2xl [&_h1]:font-bold [&_h2]:text-xl [&_h2]:font-bold [&_p]:my-2 [&_ul]:list-disc [&_ul]:pl-6 [&_table]:border [&_td]:border [&_td]:px-2"></div>
      <button id="copyTxt" class="btn hidden">Copiar texto plano</button>
    </section>

    <section data-view="pro" class="hidden">
      <div id="proGrid" class="grid sm:grid-cols-2 gap-4"></div>
    </section>
  </main>
</div>

<div id="loader" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center">
  <div class="bg-white dark:bg-slate-900 rounded-xl p-6 text-center shadow-2xl w-64">
    <div class="mx-auto h-10 w-10 rounded-full border-4 border-indigo-200 border-t-indigo-600 animate-spin"></div>
    <p id="ltxt" class="mt-3 text-sm"></p>
    <div class="mt-3 h-2 bg-slate-200 dark:bg-slate-700 rounded"><div id="bar" class="h-2 bg-indigo-600 rounded w-0 transition-all"></div></div>
  </div>
</div>

<div id="modal" class="hidden fixed inset-0 z-40 bg-black/60 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
  <div id="mbody" class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-6 w-full max-w-2xl max-h-[90vh] overflow-auto"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
