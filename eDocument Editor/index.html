<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eDocument Editor — Editor, PDF y Word en tu navegador</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/FkqbQNRQ/e-Document-Editor.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/FkqbQNRQ/e-Document-Editor.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js"></script>
<script>window.docxPreview=window.docx</script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased">
<div class="blob bg-indigo-500 w-96 h-96 -top-24 -left-24"></div>
<div class="blob bg-fuchsia-500 w-[28rem] h-[28rem] top-1/2 -right-32" style="animation-delay:-6s"></div>
<div class="blob bg-cyan-400 w-80 h-80 -bottom-24 left-1/3" style="animation-delay:-12s"></div>
<div class="flex min-h-screen">
  <aside class="glass w-16 md:w-64 shrink-0 flex flex-col sticky top-0 h-screen noprint">
    <a href="#" class="p-3 md:p-4 flex items-center justify-center md:justify-start font-extrabold" onclick="show('edit');return false"><img src="https://i.ibb.co/FkqbQNRQ/e-Document-Editor.png" alt="eDocument Editor" class="logo" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'📄 eDocument Editor'}))"><span class="hidden md:inline ml-2 text-lg">e<span class="text-indigo-500">Document</span> Editor</span></a>
    <nav id="nav" class="flex-1 px-2 space-y-1 text-sm overflow-auto"></nav>
    <button id="theme" class="nv m-2 !w-auto justify-center"><span id="ti">🌓</span> <span class="hidden md:inline">Cambiar tema</span></button>
  </aside>
  <main class="flex-1 min-w-0 p-4 md:p-8"><div class="max-w-5xl mx-auto">
    <header class="mb-6 flex flex-wrap gap-3 items-center justify-between noprint">
      <div><h1 id="title" class="text-2xl md:text-3xl font-extrabold"></h1>
      <p class="text-xs text-emerald-600 dark:text-emerald-400 mt-1">🔒 Tus archivos se procesan en tu navegador y no se suben a ningún servidor.</p></div>
      <button onclick="openPricing()" class="btn !rounded-full">⚡ Hazte PRO</button>
    </header>

    <section data-view="edit" class="hidden space-y-3">
      <div class="flex flex-wrap gap-2 items-center noprint">
        <input id="docName" class="inp flex-1 min-w-[180px] font-semibold" value="Documento sin título">
        <button class="btn ghost" onclick="edNew()">＋ Nuevo</button>
        <label class="btn ghost cursor-pointer">📂 Abrir .docx<input id="edFile" type="file" accept=".docx" hidden></label>
        <button class="btn" onclick="edDocx()">⬇ Word</button>
        <button class="btn" onclick="edPdf()">⬇ PDF</button>
        <button class="btn ghost" onclick="print()" title="Imprimir">🖨</button>
      </div>
      <div id="tb" class="glass rounded-xl p-2 flex flex-wrap gap-1 items-center sticky top-2 z-10 noprint">
        <select id="blk" class="inp"><option value="p">Párrafo</option><option value="h1">Título 1</option><option value="h2">Título 2</option><option value="h3">Título 3</option><option value="blockquote">Cita</option></select>
        <select id="fsz" class="inp"><option value="">Tamaño</option><option value="2">Pequeño</option><option value="3">Normal</option><option value="5">Grande</option><option value="6">Muy grande</option></select><i></i>
        <button data-c="bold" title="Negrita"><b>B</b></button><button data-c="italic" title="Cursiva"><i style="all:unset;font-style:italic;font-family:serif">I</i></button><button data-c="underline" title="Subrayado"><u>U</u></button><button data-c="strikeThrough" title="Tachado"><s>S</s></button><i></i>
        <button data-c="insertUnorderedList" title="Viñetas">• ≡</button><button data-c="insertOrderedList" title="Numeración">1.≡</button><i></i>
        <button data-c="justifyLeft" title="Izquierda">⇤</button><button data-c="justifyCenter" title="Centrar">≡</button><button data-c="justifyRight" title="Derecha">⇥</button><button data-c="justifyFull" title="Justificar">☰</button><i></i>
        <input type="color" id="fc" value="#4f46e5" title="Color de texto"><input type="color" id="bc" value="#fde047" title="Resaltado">
        <button id="imgBtn" title="Insertar imagen">🖼</button><input id="imgIn" type="file" accept="image/*" hidden><i></i>
        <button data-c="undo" title="Deshacer">↶</button><button data-c="redo" title="Rehacer">↷</button><button data-c="removeFormat" title="Quitar formato">🧹</button>
      </div>
      <div class="ws"><div id="edWrap"><div id="ed" class="paper" contenteditable="true" spellcheck="true"></div></div></div>
      <p class="text-xs opacity-70 flex justify-between items-center noprint"><span id="wc"></span><span class="flex items-center gap-1"><button class="vb" onclick="zoom('ed',-.1)">−</button><span id="zed" class="w-12 text-center">100%</span><button class="vb" onclick="zoom('ed',.1)">+</button> · <span id="sv"></span></span></p>
    </section>

    <section data-view="merge" class="hidden space-y-4">
      <div class="dz" data-accept=".pdf" data-multi="1" id="dzMerge"></div>
      <ul id="mergeList" class="space-y-2"></ul>
      <button class="btn" onclick="doMerge()">Unir y descargar</button>
    </section>

    <section data-view="split" class="hidden space-y-4">
      <div class="dz" data-accept=".pdf" id="dzSplit"></div>
      <p id="splitInfo" class="text-sm opacity-70"></p>
      <input id="range" class="inp" placeholder="Rango de páginas, ej: 1-3,5,8-10">
      <button class="btn" onclick="doSplit()">Extraer y descargar</button>
    </section>

    <section data-view="img" class="hidden space-y-4">
      <div class="dz" data-accept=".jpg,.jpeg,.png,.webp" data-multi="1" id="dzImg"></div>
      <ul id="imgList" class="space-y-2"></ul>
      <button class="btn" onclick="doImg()">Crear PDF</button>
    </section>

    <section data-view="gen" class="hidden space-y-3">
      <input id="gName" class="inp" placeholder="Nombre">
      <input id="gTitle" class="inp" placeholder="Título del documento">
      <input id="gDate" type="date" class="inp">
      <textarea id="gBody" rows="8" class="inp" placeholder="Contenido / Notas (una línea = un párrafo)"></textarea>
      <button class="btn" onclick="doGen()">Generar .docx</button>
    </section>

    <section data-view="read" class="hidden space-y-3">
      <div class="dz" data-accept=".docx,.pdf" id="dzRead"></div>
      <div id="vbar" class="hidden glass rounded-xl p-2 flex flex-wrap gap-2 items-center text-sm noprint">
        <span id="vname" class="font-semibold truncate max-w-[40%]"></span><span class="flex-1"></span>
        <button class="vb" onclick="gotoPg(cur-1)" title="Página anterior">◀</button>
        <span class="flex items-center gap-1">Pág. <input id="pgIn" type="number" min="1" class="inp !w-16 !py-1 text-center"> / <b id="pgN">1</b></span>
        <button class="vb" onclick="gotoPg(cur+1)" title="Página siguiente">▶</button><i class="sep"></i>
        <button class="vb" onclick="zoom('vw',-.1)">−</button><span id="zvw" class="w-12 text-center">100%</span><button class="vb" onclick="zoom('vw',.1)">+</button><button class="vb" onclick="fitW()">↔ Ajustar</button><i class="sep"></i>
        <button class="vb" onclick="edFromView()">✍️ Editar</button><button class="vb" onclick="copyView()">📋 Texto</button><button class="vb" onclick="print()">🖨</button>
      </div>
      <div id="vs" class="ws hidden" style="height:75vh"><div id="vw"></div></div>
    </section>

    <section data-view="pro" class="hidden"><div id="proGrid" class="grid sm:grid-cols-2 gap-4"></div></section>
  </div></main>
</div>

<div id="loader" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center">
  <div class="glass rounded-2xl p-6 text-center w-64">
    <div class="mx-auto h-10 w-10 rounded-full border-4 border-indigo-200 border-t-indigo-600 animate-spin"></div>
    <p id="ltxt" class="mt-3 text-sm"></p>
    <div class="mt-3 h-2 bg-slate-200 dark:bg-slate-700 rounded overflow-hidden"><div id="bar" class="h-2 bg-gradient-to-r from-indigo-500 to-fuchsia-500 rounded w-0 transition-all duration-300"></div></div>
  </div>
</div>
<div id="modal" class="hidden fixed inset-0 z-40 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
  <div id="mbody" class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-6 w-full max-w-2xl max-h-[90vh] overflow-auto"></div>
</div>
<div id="toasts"></div>
<script src="js/app.js"></script>
</body>
</html>
